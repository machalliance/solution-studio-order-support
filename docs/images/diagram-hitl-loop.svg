<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f1f1f"/></marker></defs>
<rect width="1600" height="800" fill="#f4f3f0"/>
<text x="80" y="62" font-size="30" font-weight="700" fill="#1f1f1f">How a case moves through WISMO</text>
<text x="80" y="94" font-size="18" fill="#5f5d57">The model talks. The policy decides. A person is always the fallback.</text>
<rect x="80" y="270" width="220" height="120" rx="14" fill="#fff" stroke="#d2cfc7" stroke-width="1.5"/><text x="190" y="320" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">Customer</tspan></text><text x="190" y="343.5" font-size="15.5" fill="#5f5d57" font-weight="400" text-anchor="middle"><tspan x="190" dy="0">asks in the chat on</tspan><tspan x="190" dy="20.925">the retailer's own site</tspan></text>
<rect x="380" y="270" width="240" height="120" rx="14" fill="#3f4b35" stroke="#3f4b35" stroke-width="1.5"/><text x="500" y="320" font-size="22" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="500" dy="0">WISMO agent</tspan></text><text x="500" y="343.5" font-size="15.5" fill="#dfe6d6" font-weight="400" text-anchor="middle"><tspan x="500" dy="0">the model: understands,</tspan><tspan x="500" dy="20.925">looks things up, replies</tspan></text>
<rect x="720" y="245" width="300" height="170" rx="14" fill="#ffcc29" stroke="#1f1f1f" stroke-width="3"/><text x="870" y="320" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle"><tspan x="870" dy="0">Policy gate</tspan></text><text x="870" y="343.5" font-size="15.5" fill="#3a3a3a" font-weight="400" text-anchor="middle"><tspan x="870" dy="0">deterministic code,</tspan><tspan x="870" dy="20.925">not the model</tspan></text>
<path d="M300 330 L380 330" fill="none" stroke="#1f1f1f" stroke-width="2.2"  marker-end="url(#ah)"/>
<path d="M620 330 L720 330" fill="none" stroke="#1f1f1f" stroke-width="2.2"  marker-end="url(#ah)"/>
<rect x="1160" y="150" width="360" height="110" rx="14" fill="#e6efe0" stroke="#9db78d" stroke-width="1.5"/><text x="1340" y="195" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle"><tspan x="1340" dy="0">Decided automatically</tspan></text><text x="1340" y="218.5" font-size="15.5" fill="#5f5d57" font-weight="400" text-anchor="middle"><tspan x="1340" dy="0">inside every limit: for example an</tspan><tspan x="1340" dy="20.925">in-policy return, approved with a label</tspan></text>
<rect x="1160" y="400" width="360" height="110" rx="14" fill="#fff4c7" stroke="#d9b93a" stroke-width="1.5"/><text x="1340" y="445" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle"><tspan x="1340" dy="0">Needs a person</tspan></text><text x="1340" y="468.5" font-size="15.5" fill="#5f5d57" font-weight="400" text-anchor="middle"><tspan x="1340" dy="0">the workflow suspends and the case</tspan><tspan x="1340" dy="20.925">waits in the Escalation Desk queue</tspan></text>
<path d="M1020 300 L1115 300 L1115 205 L1160 205" fill="none" stroke="#1f1f1f" stroke-width="2.2"  marker-end="url(#ah)"/>
<path d="M1020 360 L1115 360 L1115 455 L1160 455" fill="none" stroke="#1f1f1f" stroke-width="2.2"  marker-end="url(#ah)"/>
<text x="1067" y="192" font-size="14" fill="#5f5d57" font-style="italic" text-anchor="middle">within policy</text>
<text x="1067" y="349" font-size="14" fill="#5f5d57" font-style="italic" text-anchor="middle">otherwise</text>
<rect x="1160" y="590" width="360" height="110" rx="14" fill="#232323" stroke="#232323" stroke-width="1.5"/><text x="1340" y="635" font-size="22" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="1340" dy="0">A rep decides</tspan></text><text x="1340" y="658.5" font-size="15.5" fill="#d6d6d6" font-weight="400" text-anchor="middle"><tspan x="1340" dy="0">approve · reject · modify ·</tspan><tspan x="1340" dy="20.925">ask the customer · escalate to support</tspan></text>
<path d="M1340 510 L1340 590" fill="none" stroke="#1f1f1f" stroke-width="2.2"  marker-end="url(#ah)"/>
<rect x="720" y="590" width="300" height="110" rx="14" fill="#fff" stroke="#d2cfc7" stroke-width="1.5"/><text x="870" y="635" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle"><tspan x="870" dy="0">Workflow resumes</tspan></text><text x="870" y="658.5" font-size="15.5" fill="#5f5d57" font-weight="400" text-anchor="middle"><tspan x="870" dy="0">the same run, with</tspan><tspan x="870" dy="20.925">the rep's decision</tspan></text>
<path d="M1160 645 L1020 645" fill="none" stroke="#1f1f1f" stroke-width="2.2"  marker-end="url(#ah)"/>
<rect x="380" y="590" width="240" height="110" rx="14" fill="#fff" stroke="#d2cfc7" stroke-width="1.5"/><text x="500" y="635" font-size="22" fill="#1f1f1f" font-weight="700" text-anchor="middle"><tspan x="500" dy="0">Customer is told</tspan></text><text x="500" y="658.5" font-size="15.5" fill="#5f5d57" font-weight="400" text-anchor="middle"><tspan x="500" dy="0">live in the chat,</tspan><tspan x="500" dy="20.925">and by email (a stub)</tspan></text>
<path d="M720 645 L620 645" fill="none" stroke="#1f1f1f" stroke-width="2.2"  marker-end="url(#ah)"/>
<path d="M380 645 L190 645 L190 392" fill="none" stroke="#1f1f1f" stroke-width="2.2"  marker-end="url(#ah)"/>
<path d="M1340 150 L1340 128 L190 128 L190 268" fill="none" stroke="#1f1f1f" stroke-width="2.2"  marker-end="url(#ah)"/>
<text x="765" y="118" font-size="14" fill="#5f5d57" font-style="italic" text-anchor="middle">approved or declined: the customer is told in the chat</text>
<text x="870" y="448" font-size="15" fill="#5f5d57" font-weight="400" text-anchor="middle"><tspan x="870" dy="0">restrictions are checked first,</tspan><tspan x="870" dy="21">then explicit approve / decline rules;</tspan><tspan x="870" dy="21">the fallback is always a person</tspan></text>
<text x="870" y="523" font-size="15" fill="#1f1f1f" font-weight="600" text-anchor="middle"><tspan x="870" dy="0">Money only moves through the refund step in code:</tspan><tspan x="870" dy="21">amounts come from the order system,</tspan><tspan x="870" dy="21">never from the chat or the model.</tspan></text>
<text x="1340" y="735" font-size="15" fill="#5f5d57" font-weight="400" text-anchor="middle"><tspan x="1340" dy="0">No answer in the response window?</tspan><tspan x="1340" dy="21">A support ticket opens automatically.</tspan></text>
</svg>