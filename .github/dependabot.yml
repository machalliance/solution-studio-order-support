# Dependabot version updates. Dependabot alerts and security updates are switched on in the
# repository's GitHub settings (Settings > Advanced Security), not in this file.
version: 2
updates:
  # One lockfile at the repo root covers all three workspaces (apps/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
